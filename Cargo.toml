[package]
name = "kanade-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
ds_parser = "=0.4.0"
emote-psb = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol_str = "0.3"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
base64 = "0.22"
serde_yaml = "0.9"

[[test]]
name = "path_safety"
path = "tests/path_safety.rs"
