name: Deployment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate release version and destination
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Deployment must run from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "kanade-tts") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Cargo package version is not valid SemVer: $version" >&2
            exit 1
          fi
          tag="v$version"

          if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be overwritten: $tag" >&2
            exit 1
          fi

          successful_integration_runs=$(
            gh api "repos/$REPOSITORY/actions/workflows/integration.yaml/runs?head_sha=$COMMIT_SHA&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )
          if [[ "$successful_integration_runs" -lt 1 ]]; then
            echo "No successful Integration run exists for release commit $COMMIT_SHA" >&2
            exit 1
          fi
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.artifact_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
            rust_host: x86_64-unknown-linux-gnu
            artifact_name: kanade-tts-linux-amd64
            extension: tar.gz
            executable: kanade-tts
          - os: ubuntu-24.04-arm
            runner_os: Linux
            runner_arch: ARM64
            rust_host: aarch64-unknown-linux-gnu
            artifact_name: kanade-tts-linux-arm64
            extension: tar.gz
            executable: kanade-tts
          - os: macos-15
            runner_os: macOS
            runner_arch: ARM64
            rust_host: aarch64-apple-darwin
            artifact_name: kanade-tts-macos-arm64
            extension: tar.gz
            executable: kanade-tts
          - os: windows-2025
            runner_os: Windows
            runner_arch: X64
            rust_host: x86_64-pc-windows-msvc
            artifact_name: kanade-tts-windows-amd64
            extension: zip
            executable: kanade-tts.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Verify native runner and toolchain
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: ./target/release/"$EXECUTABLE" --help
      - name: Package and inspect Unix allowlist
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "staging/$ARTIFACT_NAME" dist
          install -m 0755 target/release/kanade-tts "staging/$ARTIFACT_NAME/kanade-tts"
          cp README.md THIRD_PARTY_NOTICES.md "staging/$ARTIFACT_NAME/"
          archive="dist/$ARTIFACT_NAME.tar.gz"
          tar -czf "$archive" -C staging "$ARTIFACT_NAME"
          tar -tzf "$archive"
          test "$(tar -tzf "$archive" | wc -l | tr -d ' ')" -eq 4
          tar -tzf "$archive" | grep -Fx "$ARTIFACT_NAME/"
          tar -tzf "$archive" | grep -Fx "$ARTIFACT_NAME/kanade-tts"
          tar -tzf "$archive" | grep -Fx "$ARTIFACT_NAME/README.md"
          tar -tzf "$archive" | grep -Fx "$ARTIFACT_NAME/THIRD_PARTY_NOTICES.md"
      - name: Package and inspect Windows allowlist
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "staging/$ARTIFACT_NAME" dist
          cp target/release/kanade-tts.exe "staging/$ARTIFACT_NAME/kanade-tts.exe"
          cp README.md THIRD_PARTY_NOTICES.md "staging/$ARTIFACT_NAME/"
          python - "$ARTIFACT_NAME" <<'PY'
          import sys
          import zipfile

          artifact = sys.argv[1]
          members = [
              f"{artifact}/kanade-tts.exe",
              f"{artifact}/README.md",
              f"{artifact}/THIRD_PARTY_NOTICES.md",
          ]
          with zipfile.ZipFile(f"dist/{artifact}.zip", "w", zipfile.ZIP_DEFLATED) as package:
              package.writestr(f"{artifact}/", b"")
              for member in members:
                  package.write(f"staging/{member}", member)
          with zipfile.ZipFile(f"dist/{artifact}.zip") as package:
              if package.namelist() != [f"{artifact}/", *members]:
                  raise SystemExit("unexpected Windows package members")
              if package.testzip() is not None:
                  raise SystemExit("Windows package CRC mismatch")
          PY
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download Linux amd64 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanade-tts-linux-amd64
          path: dist
          digest-mismatch: error
      - name: Download Linux arm64 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanade-tts-linux-arm64
          path: dist
          digest-mismatch: error
      - name: Download macOS package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanade-tts-macos-arm64
          path: dist
          digest-mismatch: error
      - name: Download Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanade-tts-windows-amd64
          path: dist
          digest-mismatch: error
      - name: Verify packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import stat
          import tarfile
          import zipfile

          packages = {
              "kanade-tts-linux-amd64.tar.gz": ("linux-amd64", "elf", 62),
              "kanade-tts-linux-arm64.tar.gz": ("linux-arm64", "elf", 183),
              "kanade-tts-macos-arm64.tar.gz": ("macos-arm64", "macho", None),
              "kanade-tts-windows-amd64.zip": ("windows-amd64", "pe", None),
          }
          dist = Path("dist")
          actual = sorted(path.relative_to(dist).as_posix() for path in dist.rglob("*"))
          if actual != sorted(packages):
              raise SystemExit(f"unexpected files in dist: {actual!r}")

          for archive_name, (target, binary_format, machine) in packages.items():
              archive = dist / archive_name
              if archive.is_symlink() or not archive.is_file():
                  raise SystemExit(f"archive is not a regular file: {archive}")
              artifact = f"kanade-tts-{target}"
              executable = "kanade-tts.exe" if binary_format == "pe" else "kanade-tts"
              expected = {
                  f"{artifact}/": "dir",
                  f"{artifact}/{executable}": "executable",
                  f"{artifact}/README.md": "file",
                  f"{artifact}/THIRD_PARTY_NOTICES.md": "file",
              }
              if archive_name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as package:
                      members = package.getmembers()
                      names = [member.name.rstrip("/") + ("/" if member.isdir() else "") for member in members]
                      if sorted(names) != sorted(expected):
                          raise SystemExit(f"unexpected tar members in {archive}: {names!r}")
                      for member, name in zip(members, names):
                          kind = expected[name]
                          if kind == "dir" and not member.isdir():
                              raise SystemExit(f"not a directory: {name}")
                          if kind != "dir" and not member.isreg():
                              raise SystemExit(f"not a regular file: {name}")
                          if kind == "executable" and member.mode & 0o111 == 0:
                              raise SystemExit(f"not executable: {name}")
                      binary = package.extractfile(f"{artifact}/{executable}").read()
              else:
                  with zipfile.ZipFile(archive) as package:
                      members = package.infolist()
                      names = [member.filename for member in members]
                      if sorted(names) != sorted(expected):
                          raise SystemExit(f"unexpected ZIP members in {archive}: {names!r}")
                      for member in members:
                          kind = expected[member.filename]
                          mode_type = stat.S_IFMT((member.external_attr >> 16) & 0xFFFF)
                          if member.flag_bits & 1:
                              raise SystemExit(f"encrypted ZIP member: {member.filename}")
                          if member.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                              raise SystemExit(f"unsupported ZIP compression: {member.filename}")
                          if kind == "dir" and (not member.is_dir() or mode_type not in (0, stat.S_IFDIR)):
                              raise SystemExit(f"not a directory: {member.filename}")
                          if kind != "dir" and (member.is_dir() or mode_type not in (0, stat.S_IFREG)):
                              raise SystemExit(f"not a regular file: {member.filename}")
                      if package.testzip() is not None:
                          raise SystemExit(f"ZIP CRC mismatch: {archive}")
                      binary = package.read(f"{artifact}/{executable}")

              if binary_format == "elf":
                  if (len(binary) < 20 or binary[:4] != b"\x7fELF"
                          or binary[4:6] != b"\x02\x01"
                          or int.from_bytes(binary[18:20], "little") != machine):
                      raise SystemExit(f"wrong ELF architecture: {archive}")
              elif binary_format == "macho":
                  if (len(binary) < 8 or binary[:4] != b"\xcf\xfa\xed\xfe"
                          or int.from_bytes(binary[4:8], "little") != 0x0100000C):
                      raise SystemExit(f"wrong Mach-O architecture: {archive}")
              else:
                  if len(binary) < 0x40 or binary[:2] != b"MZ":
                      raise SystemExit(f"not a PE executable: {archive}")
                  offset = int.from_bytes(binary[0x3C:0x40], "little")
                  if (offset + 26 > len(binary) or binary[offset:offset + 4] != b"PE\0\0"
                          or int.from_bytes(binary[offset + 4:offset + 6], "little") != 0x8664
                          or int.from_bytes(binary[offset + 24:offset + 26], "little") != 0x20B):
                      raise SystemExit(f"wrong PE32+ architecture: {archive}")
              print(f"verified {archive}")
          PY

          (
            cd dist
            sha256sum \
              kanade-tts-linux-amd64.tar.gz \
              kanade-tts-linux-arm64.tar.gz \
              kanade-tts-macos-arm64.tar.gz \
              kanade-tts-windows-amd64.zip > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          existing_release_count=$(
            gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" \
              | jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length'
          )
          if [[ "$existing_release_count" -ne 0 ]]; then
            echo "Release already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag appeared during the build: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$COMMIT_SHA" >/dev/null
          tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$COMMIT_SHA"
      - name: Create and verify draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/kanade-tts-linux-amd64.tar.gz \
            dist/kanade-tts-linux-arm64.tar.gz \
            dist/kanade-tts-macos-arm64.tar.gz \
            dist/kanade-tts-windows-amd64.zip \
            dist/SHA256SUMS \
            --repo "$REPOSITORY" \
            --verify-tag \
            --target "$COMMIT_SHA" \
            --title "kanade-tts $RELEASE_TAG" \
            --generate-notes \
            --draft

          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json databaseId,isDraft,isPrerelease,tagName,targetCommitish)
          test "$(jq -r '.isDraft' <<< "$release_json")" = true
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = false
          test "$(jq -r '.tagName' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.targetCommitish' <<< "$release_json")" = "$COMMIT_SHA"
          release_id=$(jq -r '.databaseId' <<< "$release_json")
          test "$release_id" != null

          expected_assets=$(
            for asset in \
              dist/kanade-tts-linux-amd64.tar.gz \
              dist/kanade-tts-linux-arm64.tar.gz \
              dist/kanade-tts-macos-arm64.tar.gz \
              dist/kanade-tts-windows-amd64.zip \
              dist/SHA256SUMS; do
              printf '%s %s sha256:%s\n' \
                "$(basename "$asset")" \
                "$(stat -c '%s' "$asset")" \
                "$(sha256sum "$asset" | cut -d ' ' -f 1)"
            done | sort
          )
          actual_assets=$(gh api "repos/$REPOSITORY/releases/$release_id/assets" --paginate \
            --jq 'sort_by(.name)[] | "\(.name) \(.size) \(.digest)"')
          test "$actual_assets" = "$expected_assets"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Publish and verify release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --draft=false \
            --latest

          release_json=$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.draft' <<< "$release_json")" = false
          test "$(jq -r '.prerelease' <<< "$release_json")" = false
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          tag_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$COMMIT_SHA"
          test "$(jq '.assets | length' <<< "$release_json")" -eq 5
